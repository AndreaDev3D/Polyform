# Cutting a release: push a tag, get a DRAFT GitHub Release with installers for
# all three platforms and a SHA256SUMS.txt covering every file.
#
#   git tag v0.7.0 && git push origin v0.7.0
#
# Draft on purpose. A tag should be able to produce a release without also
# announcing one: someone opens the draft, reads the notes, downloads one
# artifact, checks it runs, and presses Publish. See docs/Releasing.md.
#
# What this does NOT do yet: Authenticode / Developer ID signing (Roadmap 5.2,
# F-10). Until then the installers trip SmartScreen and Gatekeeper, and the app
# will not install an update for itself — updater.ts explains why.
#
# What it DOES do, free: every artifact gets a **Sigstore build-provenance
# attestation** signed by GitHub's OIDC identity for this workflow. That is not
# code signing (it does not touch SmartScreen or Gatekeeper) but it is real
# integrity: anyone can prove a file came out of this repo's release workflow
# from this commit, rather than out of somebody's laptop.
#
#   gh attestation verify Polyform-Setup-0.7.0-x64.exe --repo AndreaDev3D/Polyform
#
# It only works on public repositories, which this is.

name: Release

# A VERSION BUMP is what makes a release, not a remembered ritual: land a change
# to package.json's version on main and this runs. Pushing a `v*` tag by hand does
# the same thing, for a re-cut. Every other push decides "no" in ten seconds and
# stops.
#
# Why not a workflow that pushes a tag? A tag created with the default token does
# not trigger workflows (GitHub's recursion guard), so it would need a stored PAT.
# `gh release create` creates the tag itself from the commit being released, so no
# secret is needed and there is one fewer moving part.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# One release run at a time. Two pushes in quick succession would otherwise both
# see "not released yet" and race to create the same release — the loser fails on
# a name that already exists, having burnt three platform builds to get there.
# Queued rather than cancelled: a run that is already uploading should finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Is there a release to make? Cheap, and it gates everything below.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A hand-cut tag must agree with package.json, or v0.7.0 ships files
            # called 0.6.0 and the checksums describe a version nobody asked for.
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match package.json version $version" >&2
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "releasing $version from tag ${GITHUB_REF_NAME}"
            exit 0
          fi
          # On main: release only if this version has not been released yet.
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released — nothing to do"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag v$version already exists — push it, or bump the version"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version bumped to $version and never released — releasing"
          fi

  # Everything CI does on a normal push, before a single artifact is built. A
  # release that skipped the suite is not worth the tag.
  ci:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/build.yml

  build:
    needs: [decide, ci]
    if: needs.decide.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            xvfb: ''
          - os: macos-latest
            target: mac
            xvfb: ''
          - os: ubuntu-latest
            target: linux
            xvfb: xvfb-run -a
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      # For the Sigstore attestation: an OIDC token identifying this workflow,
      # and permission to record the attestation against the repo.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # package.json names the FILES. If this runner disagrees with what `decide`
      # resolved, the artifacts would carry a version nobody asked for.
      - name: Version being released
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ needs.decide.outputs.version }}" ]; then
            echo "package.json says $pkg, this run releases ${{ needs.decide.outputs.version }}" >&2
            exit 1
          fi
          echo "releasing $pkg"
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The packaged tree needs its sandbox helper owned by root; the .deb and
      # AppImage set that on install, an unpacked directory cannot. Fix it here
      # rather than passing --no-sandbox, so the smoke test runs the app the way
      # an installed one runs — sandbox on.
      - name: Sandbox helper permissions (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Packaging smoke test
        run: ${{ matrix.xvfb }} npm run test:packaging -- --expect-feed
      - name: SHA-256 checksums
        run: node scripts/checksums.mjs release --out SHA256SUMS-${{ matrix.target }}.txt
      # Free provenance, since there is no money for certificates: a Sigstore
      # attestation binding these exact bytes to this repo, workflow and commit.
      # Verify with `gh attestation verify <file> --repo AndreaDev3D/Polyform`.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error

  publish:
    needs: [decide, build]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: v${{ needs.decide.outputs.version }}
    permissions:
      # The only write in either workflow, and only for a release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ONLY this workflow's artifacts. Without the pattern it also downloads the
      # `polyform-*` set that the CI workflow we call uploads for the same commit —
      # two independent builds of identically-named installers, landing on top of
      # each other, after which the merged checksums describe files that were
      # overwritten by their twins and `sha256sum -c` fails. (The duplicate build
      # is known and tolerated: a release re-runs the full suite on purpose.)
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: incoming
      # Flatten, and merge the three per-platform checksum files into the one
      # file a downloader actually wants: `sha256sum -c SHA256SUMS.txt`.
      - name: Collect artifacts and merge checksums
        run: |
          mkdir -p dist
          find incoming -type f ! -name 'SHA256SUMS-*.txt' -exec mv {} dist/ \;
          cat incoming/*/SHA256SUMS-*.txt | sort -k2 > dist/SHA256SUMS.txt
          echo "--- SHA256SUMS.txt"
          cat dist/SHA256SUMS.txt
          ( cd dist && sha256sum -c SHA256SUMS.txt )
      - name: Release notes
        run: |
          {
            echo "## Polyform ${TAG}"
            echo
            echo "Changes: see [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
            echo
            echo "### Verify your download"
            echo
            echo "Checksums:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS.txt        # Linux"
            echo "shasum -a 256 -c SHA256SUMS.txt    # macOS"
            echo 'Get-FileHash .\<file> -Algorithm SHA256   # Windows, compare against SHA256SUMS.txt'
            echo '```'
            echo
            echo "Provenance — proves the file came out of this repo's release workflow, not someone's laptop:"
            echo
            echo '```sh'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "### These builds are not code signed"
            echo
            echo "There is no certificate yet (Roadmap 5.2), so:"
            echo
            echo "- **Windows** shows a SmartScreen warning: *More info* → *Run anyway*."
            echo "- **macOS** refuses on first launch: right-click the app → *Open*, or"
            echo '  `xattr -d com.apple.quarantine /Applications/Polyform.app`.'
            echo "- **Polyform will not install updates for itself.** It can tell you a new version"
            echo "  exists (Help → Check for Updates, off by default on launch) and link here."
            echo "  An updater that installs unverifiable binaries is worse than no updater."
            echo
            echo "The checksum and the attestation above are what you have instead of a signature."
            echo
            echo "Third-party licences ship with the app (Help → Third-Party Licences)."
          } > NOTES.md
          cat NOTES.md
      # gh is preinstalled on the runner: one less third-party action in a
      # pipeline whose whole job is producing trustworthy bytes.
      #
      # $TAG, not $GITHUB_REF_NAME: on a version-bump run the ref IS `main`, and
      # using it produced a draft release literally tagged "main". `--target` pins
      # the tag to the commit being released, and gh creates that tag when the
      # draft is published.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Polyform $TAG" \
            --notes-file NOTES.md \
            dist/*
          echo "Draft release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
