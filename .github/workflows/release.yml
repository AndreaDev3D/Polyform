# Two branches, two kinds of release.
#
#   staging     → every push publishes a BETA: `0.8.0-beta.<run>`, marked
#                 pre-release, PUBLISHED (not draft — see below), and offered only
#                 to people who ticked "betas" in the app.
#   production  → a VERSION BUMP in package.json opens a stable DRAFT release for
#                 a human to read and publish.
#
# Why betas are published pre-releases and not drafts. A draft has no tag and
# GitHub shows it only to callers with push access, so nothing that could ever
# reach an updater exists: no tag to download from, and an anonymous client sees
# no release at all. "Pre-release" is the state that is visible, tagged and
# excluded from `releases/latest` — which is exactly "beta". So the app's beta
# opt-in is `allowPrerelease`, and the pre-release flag is what gates who sees it.
#
# Draft for stable on purpose. Bumping a version should be able to produce a
# release without also announcing one: someone opens the draft, reads the notes,
# downloads one artifact, checks it runs, and presses Publish. See docs/Releasing.md.
#
# What this does NOT do yet: Authenticode / Developer ID signing (Roadmap 5.2,
# F-10). Until then the installers trip SmartScreen and Gatekeeper, and the app
# will not install an update for itself — updater.ts explains why.
#
# What it DOES do, free: every artifact gets a **Sigstore build-provenance
# attestation** signed by GitHub's OIDC identity for this workflow. That is not
# code signing (it does not touch SmartScreen or Gatekeeper) but it is real
# integrity: anyone can prove a file came out of this repo's release workflow
# from this commit, rather than out of somebody's laptop.
#
#   gh attestation verify Polyform-Setup-0.7.0-x64.exe --repo AndreaDev3D/Polyform
#
# It only works on public repositories, which this is.

name: Release

# On production a VERSION BUMP is what makes a release, not a remembered ritual.
# On staging every push makes a beta, so nothing has to be remembered at all. A
# `v*` tag pushed by hand still works for a re-cut of either kind.
#
# Why not a workflow that pushes a tag? A tag created with the default token does
# not trigger workflows (GitHub's recursion guard), so it would need a stored PAT.
# `gh release create` creates the tag itself from the commit being released, so no
# secret is needed and there is one fewer moving part.
on:
  push:
    branches: [staging, production]
    tags: ['v*']

permissions:
  contents: read

# One release run at a time. Two pushes in quick succession would otherwise both
# see "not released yet" and race to create the same release — the loser fails on
# a name that already exists, having burnt three platform builds to get there.
# Queued rather than cancelled: a run that is already uploading should finish.
concurrency:
  # Per branch, so a beta cut from staging and a stable cut from production never
  # race for the same tag — and two quick staging pushes queue rather than fight.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Is there a release to make? Cheap, and it gates everything below.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # `write` for a READ, which needs saying: GitHub lists DRAFT releases only
      # to callers with push access, so a `contents: read` token sees nothing but
      # published ones. With read, this job could not see the draft it had just
      # produced, decided "not released yet", and rebuilt everything on every
      # push. Nothing here writes.
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          # Refuse a pre-release version in package.json. The beta suffix is added
          # here from the run number; a `0.8.0-beta.1` in the file would produce
          # `0.8.0-beta.1-beta.42`, which is not a version.
          case "$base" in
            *-*) echo "package.json version is $base — the branch decides the channel, so keep it plain (0.8.0)" >&2; exit 1 ;;
          esac

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            # A hand-cut tag must agree with package.json, or v0.7.0 ships files
            # called 0.6.0 and the checksums describe a version nobody asked for.
            # Compared against the tag's BASE, so `v0.8.0-beta.3` is a legal
            # re-cut of a beta on a 0.8.0 package.
            if [ "${tag_version%%-*}" != "$base" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match package.json version $base" >&2
              exit 1
            fi
            case "$tag_version" in
              *-*) channel=beta ;;
              *) channel=stable ;;
            esac
            echo "version=$tag_version" >> "$GITHUB_OUTPUT"
            echo "channel=$channel" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "releasing $tag_version ($channel) from tag ${GITHUB_REF_NAME}"
            exit 0
          fi

          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            # A beta per push, ordered by the run number — which only ever
            # increases, so `0.8.0-beta.41` < `0.8.0-beta.42` by semver's own rule
            # for numeric pre-release identifiers, and every one of them is below
            # the eventual `0.8.0`. No "is it released yet" question to ask: the
            # version is new by construction.
            echo "version=$base-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "cutting beta $base-beta.${GITHUB_RUN_NUMBER}"
            exit 0
          fi

          # production: release only if this version has no release yet.
          #
          # Listing releases, NOT `gh release view "v$base"`: the tags endpoint
          # that backs `view` only matches PUBLISHED releases, so it cannot see a
          # draft — and a draft is exactly the state this pipeline leaves behind.
          # The blind check re-ran the whole release on every push and would have
          # piled up duplicate drafts against the same tag, which GitHub permits.
          # Fetched into a variable first: piping straight into grep hides an API
          # failure as "no match", and "no match" here means RELEASE — the one
          # default a broken query must not have.
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "channel=stable" >> "$GITHUB_OUTPUT"
          if ! existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')"; then
            echo "could not list releases — refusing to guess whether v$base is released" >&2
            exit 1
          fi
          if grep -qx "v$base" <<<"$existing"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$base already has a release (draft or published) — nothing to do"
          elif git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag v$base already exists — push it, or bump the version"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version bumped to $base and never released — releasing"
          fi

  # Everything CI does on a normal push, before a single artifact is built. A
  # release that skipped the suite is not worth the tag.
  ci:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      # The tests and the input-layer gates, not the packaging: the build job
      # below packages, smoke-tests and attests the artifacts that actually ship.
      skip_package: true

  build:
    needs: [decide, ci]
    if: needs.decide.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            xvfb: ''
          - os: macos-latest
            target: mac
            xvfb: ''
          - os: ubuntu-latest
            target: linux
            xvfb: xvfb-run -a
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      # For the Sigstore attestation: an OIDC token identifying this workflow,
      # and permission to record the attestation against the repo.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # package.json names the FILES — the installers, the app's own About box and
      # the update feed all read it — so it has to say what this run is releasing.
      #
      # For a beta that means WRITING it: the branch and the run number decide the
      # version, not the file. It is set with --no-git-tag-version and never
      # committed; the tag comes from `gh release create` against this commit.
      - name: Version being released
        shell: bash
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          if [ "${VERSION%%-*}" != "$pkg" ]; then
            echo "package.json says $pkg, this run releases $VERSION — the base versions must agree" >&2
            exit 1
          fi
          if [ "$VERSION" != "$pkg" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
            echo "package.json set to $(node -p "require('./package.json').version") for this build only"
          fi
          echo "releasing $VERSION"
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The packaged tree needs its sandbox helper owned by root; the .deb and
      # AppImage set that on install, an unpacked directory cannot. Fix it here
      # rather than passing --no-sandbox, so the smoke test runs the app the way
      # an installed one runs — sandbox on.
      - name: Sandbox helper permissions (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      # electron-builder prints "signing with signtool.exe" even when there is no
      # certificate and the result is unsigned — which reads as "we signed it" in a
      # log and is how a maintainer ends up surprised by SmartScreen. So state the
      # truth per platform.
      #
      # macOS is an ASSERTION, not a note: an arm64 binary with no signature at all
      # will not launch on Apple Silicon, so ad-hoc signing is the difference
      # between a dmg that opens with a right-click and one that cannot run.
      - name: Signing status (truthful)
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "win" ]; then
            powershell -NoProfile -Command '
              Get-ChildItem release\*.exe | ForEach-Object {
                $s = Get-AuthenticodeSignature $_.FullName
                Write-Host ("{0}: {1}" -f $_.Name, $s.Status)
              }'
            echo "NOT Authenticode signed — expected until Roadmap 5.2 (F-10). SmartScreen will warn."
          elif [ "${{ matrix.target }}" = "mac" ]; then
            for app in release/mac*/Polyform.app; do
              [ -d "$app" ] || continue
              echo "--- $app"
              codesign -dv --verbose=2 "$app" 2>&1 | sed -n '1,8p'
              codesign --verify --deep --strict "$app" || { echo "unsigned: an arm64 build will not launch" >&2; exit 1; }
              # An ad-hoc signature plus the hardened runtime means library
              # validation refuses Electron's own frameworks unless this
              # entitlement is present — and the symptom is an app that simply
              # does not start. Assert it is in the SIGNATURE, not merely in a
              # plist we hoped was used.
              codesign -d --entitlements :- "$app" 2>/dev/null | grep -q 'disable-library-validation'                 || { echo "ad-hoc signed without disable-library-validation: the app will not launch" >&2; exit 1; }
            done
            echo "Ad-hoc signed (not Developer ID, not notarized): Gatekeeper still needs a right-click → Open."
          else
            echo "Linux artifacts carry no code signature; the checksum and the attestation are the integrity signals."
          fi
      - name: Packaging smoke test
        run: ${{ matrix.xvfb }} npm run test:packaging -- --expect-feed
      - name: SHA-256 checksums
        run: node scripts/checksums.mjs release --out SHA256SUMS-${{ matrix.target }}.txt
      # Free provenance, since there is no money for certificates: a Sigstore
      # attestation binding these exact bytes to this repo, workflow and commit.
      # Verify with `gh attestation verify <file> --repo AndreaDev3D/Polyform`.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
      # THE UPDATE FEED — the file electron-updater actually fetches, and the one
      # thing this pipeline never published. Without it every check dies with
      # ERR_UPDATER_CHANNEL_FILE_NOT_FOUND (F-29).
      #
      # BOTH channel names, from one build, because the two halves disagree about
      # naming and only one of them is ours to change:
      #
      #   * electron-builder writes ONE file for the github provider — `latest.yml`
      #     (`latest-mac.yml`, `latest-linux.yml`) — whatever the version says.
      #     `computeChannelNames` returns `[currentChannel]` unconditionally for
      #     github, and `generateUpdatesFilesForAllChannels` is ignored there. Its
      #     own docs say the channel is "never auto-detected" for github.
      #   * electron-updater asks for `${channel}.yml`, and when the release it
      #     picked is a PRE-RELEASE it derives the channel from that tag —
      #     `v0.8.0-beta.7` → `beta.yml` (`beta-mac.yml`, `beta-linux.yml`).
      #
      # So a beta release needs `beta*.yml` and a stable release needs `latest*.yml`
      # — and a stable release ALSO needs `beta*.yml`, for the beta user who is
      # offered the stable version that supersedes their build. Copying is exact:
      # the file describes the artifact, not the channel.
      - name: Update feed for both channels
        shell: bash
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          latest=(release/latest*.yml)
          if [ ${#latest[@]} -eq 0 ]; then
            echo "electron-builder wrote no latest*.yml — the updater would have nothing to read" >&2
            ls -la release/ >&2
            exit 1
          fi
          for f in "${latest[@]}"; do
            grep -q "version: $VERSION" "$f" || { echo "$f does not name version $VERSION" >&2; cat "$f" >&2; exit 1; }
            cp "$f" "${f/latest/beta}"
          done
          for f in release/latest*.yml release/beta*.yml; do
            echo "--- $f"
            cat "$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error

  publish:
    needs: [decide, build]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: v${{ needs.decide.outputs.version }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
    permissions:
      # The only write in either workflow, and only for a release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ONLY this workflow's artifacts. Without the pattern it also downloads the
      # `polyform-*` set that the CI workflow we call uploads for the same commit —
      # two independent builds of identically-named installers, landing on top of
      # each other, after which the merged checksums describe files that were
      # overwritten by their twins and `sha256sum -c` fails. (The duplicate build
      # is known and tolerated: a release re-runs the full suite on purpose.)
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: incoming
      # Flatten, and merge the three per-platform checksum files into the one
      # file a downloader actually wants: `sha256sum -c SHA256SUMS.txt`.
      - name: Collect artifacts and merge checksums
        run: |
          mkdir -p dist
          find incoming -type f ! -name 'SHA256SUMS-*.txt' -exec mv {} dist/ \;
          cat incoming/*/SHA256SUMS-*.txt | sort -k2 > dist/SHA256SUMS.txt
          echo "--- SHA256SUMS.txt"
          cat dist/SHA256SUMS.txt
          ( cd dist && sha256sum -c SHA256SUMS.txt )
      - name: Release notes
        run: |
          {
            echo "## Polyform ${TAG}"
            echo
            if [ "$CHANNEL" = "beta" ]; then
              echo "**This is a beta**, cut automatically from \`staging\` at \`${GITHUB_SHA:0:7}\`."
              echo "It passed the same gates a release does — unit tests, the input-layer e2e"
              echo "gates, the CLI gate and a packaging smoke test on all three platforms — but"
              echo "no human has read it. Keep a backup of anything you care about."
              echo
              echo "Tick **betas** next to *Check for updates* on Polyform's welcome screen to be"
              echo "told when one of these appears. Untick it and you are back on stable only."
              echo
            fi
            echo "Changes: see [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
            echo
            echo "### Verify your download"
            echo
            echo "Checksums:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS.txt        # Linux"
            echo "shasum -a 256 -c SHA256SUMS.txt    # macOS"
            echo 'Get-FileHash .\<file> -Algorithm SHA256   # Windows, compare against SHA256SUMS.txt'
            echo '```'
            echo
            echo "Provenance — proves the file came out of this repo's release workflow, not someone's laptop:"
            echo
            echo '```sh'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "### These builds are not code signed"
            echo
            echo "There is no certificate yet (Roadmap 5.2), so:"
            echo
            echo "- **Windows** shows a SmartScreen warning: *More info* → *Run anyway*."
            echo "- **macOS** refuses on first launch: right-click the app → *Open*, or"
            echo '  `xattr -d com.apple.quarantine /Applications/Polyform.app`.'
            echo "- **Polyform will not install updates for itself.** It can tell you a new version"
            echo "  exists (Help → Check for Updates, off by default on launch) and link here."
            echo "  An updater that installs unverifiable binaries is worse than no updater."
            echo
            echo "The checksum and the attestation above are what you have instead of a signature."
            echo
            echo "Third-party licences ship with the app (Help → Third-Party Licences)."
          } > NOTES.md
          cat NOTES.md
      # gh is preinstalled on the runner: one less third-party action in a
      # pipeline whose whole job is producing trustworthy bytes.
      #
      # $TAG, not $GITHUB_REF_NAME: on a version-bump run the ref IS `main`, and
      # using it produced a draft release literally tagged "main". `--target` pins
      # the tag to the commit being released, and gh creates that tag when the
      # draft is published.
      #
      # A beta is PUBLISHED and flagged pre-release, because that is the only state
      # an updater can reach: a draft has no tag to download from and GitHub hides
      # it from anyone without push access. Pre-release is also what makes the
      # opt-in work — it keeps the build out of `releases/latest`, which is the
      # endpoint a client with `allowPrerelease: false` resolves.
      #
      # Stable stays a DRAFT for a human to read and publish.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "beta" ]; then
            visibility=--prerelease
            kind="Pre-release"
          else
            visibility=--draft
            kind="Draft release"
          fi
          gh release create "$TAG" \
            $visibility \
            --target "$GITHUB_SHA" \
            --title "Polyform $TAG" \
            --notes-file NOTES.md \
            dist/*
          echo "$kind: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
      # Every push to staging mints a release, so without this the list becomes
      # hundreds of betas and the stable ones get hard to find. Keep the newest ten;
      # delete older betas AND their tags, because a tag left behind is a dangling
      # ref that every `git fetch --tags` keeps forever.
      #
      # Only ever touches `v*-beta.N` pre-releases: never a stable release, never a
      # draft, and never the one just created.
      # The round trip, against the release that now exists: ask GitHub for the feed
      # file the app will ask for, read the version out of it, and HEAD every file it
      # names. Only for a beta — a draft's assets are not public, so a stable draft
      # cannot be checked until someone publishes it (`npm run test:feed` after).
      - name: Update feed answers the way the app will ask
        if: needs.decide.outputs.channel == 'beta'
        run: npm run test:feed -- --repo "$GITHUB_REPOSITORY" --expect-version "${{ needs.decide.outputs.version }}"
      - name: Prune old betas
        if: needs.decide.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 10
        run: |
          set -euo pipefail
          mapfile -t betas < <(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.prerelease == true and .draft == false) | select(.tag_name | test("^v[0-9].*-beta\\.[0-9]+$")) | .tag_name')
          echo "${#betas[@]} beta release(s) exist; keeping the newest $KEEP"
          i=0
          for tag in "${betas[@]}"; do
            i=$((i+1))
            if [ "$i" -le "$KEEP" ] || [ "$tag" = "$TAG" ]; then continue; fi
            echo "deleting $tag and its tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
